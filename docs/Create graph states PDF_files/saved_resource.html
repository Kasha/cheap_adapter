:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  color: var(--foreground);
  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

:root:not([data-app-block-surface], [data-visualize-standalone]) > body {
  padding: 12px;
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);

}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;

  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

  gap: 2px;

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  margin-block: 6px;

  background: var(--border);

.nav {
  display: flex;
  min-width: 0;

  gap: 4px;
}

.progress-bar {

.viz-badge {

.text-muted {

.tabular-nums {
  font-variant-numeric: tabular-nums;

  <script>
  (() => {
    const root=document.getElementById('cat-dog-clear');
    const container=root.querySelector('.plot');
    const ns='http://www.w3.org/2000/svg';
    const pts=[[-3,-0.5,'Cat 1'],[-3,0.5,'Cat 2'],[3,-0.5,'Dog 1'],[3,0.5,'Dog 2']];
    const l1=12,l2=1/3,theta=Math.PI/6;
    let step=0;
    function coords(a,b,s) {
      if(s===0) return [a*Math.cos(theta)-b*Math.sin(theta),a*Math.sin(theta)+b*Math.cos(theta)];

      [-3,0,3].forEach(t=>{
        node(svg,'text',{x:x(t),y:h-bottom+20,'text-anchor':'middle'},t);
        node(svg,'text',{x:left-10,y:y(t)+4,'text-anchor':'end'},t);
      });
      node(svg,'text',{x:left+side/2,y:h-10,'text-anchor':'middle',class:'axis-title','data-axis':'x'},step===0?'Feature 1 (units)':step===1?'PC1 (units)':'PC1 (standard deviations)');
      node(svg,'text',{transform:`translate(18 ${top+side/2}) rotate(-90)`,'text-anchor':'middle',class:'axis-title','data-axis':'y'},step===0?'Feature 2 (units)':step===1?'PC2 (units)':'PC2 (standard deviations)');
      node(svg,'text',{x:left,y:22},step===0?'Tilted cloud':step===1?'Same points, rotated coordinates':'Same points, rescaled coordinates');
      const dirs=[[3.65,0,'v1'],[0,1.2,'v2']];
      if(step===2){dirs[0][0]=1.7*Math.sqrt(l1);dirs[1][1]=1.7*Math.sqrt(l2);}

        node(svg,'text',{x:x(p[0])+5,y:y(p[1])-8},label);
      });
      pts.forEach((p,i)=>{
        const q=coords(p[0],p[1],step),g=node(svg,'g',{transform:`translate(${x(q[0])} ${y(q[1])})`});
        const color=i<2?'var(--viz-series-1)':'var(--viz-series-2)';
        node(g,i<2?'circle':'rect',i<2?{r:7,fill:color}:{x:-7,y:-7,width:14,height:14,fill:color});
        node(g,'text',{x:i<2?-13:13,y:4,'text-anchor':i<2?'end':'start'},p[2]);
        node(g,'title',{},`${p[2]}: (${q[0].toFixed(2)}, ${q[1].toFixed(2)})`);

          const old=coords(p[0],p[1],previousStep);
          const a=node(g,'animateTransform',{attributeName:'transform',type:'translate',from:`${x(old[0])} ${y(old[1])}`,to:`${x(q[0])} ${y(q[1])}`,dur:'0.45s',fill:'freeze'});a.beginElement();
        }
      });
      root.querySelector('#eigen-values').textContent=step===2?'Whitened variances: PC1 = 1; PC2 = 1.':'Covariance eigenvalues: λ1 = 12; λ2 = 0.333. Spread ratio (standard deviations): 6:1.';
    }
    let previousStep=0;
    root.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{
      previousStep=step;step=Number(b.dataset.step);
      root.querySelectorAll('[data-step]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));draw(true);

    activeTrigger = null;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );

      strategy: "fixed",

    floating.style.visibility = "hidden";

    setDescribedBy(trigger, true);

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||

      immediate || activeTrigger != null || Date.now() < skipDelayUntil

  };

    }

      closeTooltip();
    }

    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };

    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerdown", handlePointer);
    document.removeEventListener("pointercancel", handlePointer);
    document.removeEventListener("click", handleTouchClick);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerdown", handlePointer);
  document.addEventListener("pointercancel", handlePointer);
  document.addEventListener("click", handleTouchClick);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>

    <script>
  (() => {
    const isOpenStyleMode = false;

    function updateSurface(surface) {
      if (surface !== "inline" && surface !== "stage") {
        return;
      }

      const root = document.documentElement;
      const isDarkMode = root.classList.contains("dark");
      const surfaceBackgrounds = isDarkMode
        ? { inline: "#000000", stage: "#212121" }
        : { inline: "#fcfcfc", stage: "#ffffff" };
      root.setAttribute("data-app-block-surface", surface);
      root.style.backgroundColor =
        surface === "inline" && isOpenStyleMode
          ? "transparent"
          : "var(--main-surface-primary, " + surfaceBackgrounds[surface] + ")";
    }

    window.addEventListener("openai:set_globals", (event) => {
      const surface = event.detail?.globals?.__appBlockSurface;
      if (surface != null) {
        updateSurface(surface);
      }
    });

    const initialSurface =
      window.openai?.__appBlockSurface ??
      document.documentElement.getAttribute("data-app-block-surface") ??
      "inline";
    updateSurface(initialSurface);
  })();
</script>
